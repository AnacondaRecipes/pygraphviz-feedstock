{% set name = "pygraphviz" %}
{% set version = "2.0" %}
{% set sha256 = "7cc6cfff4bfa6c1bf389cbbf72f5995a717c69de69c18763544c04b41181f59e" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  # For some reason there are no .gz files here
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - pkg-config
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - graphviz
    - setuptools >=78
    - swig >4.1.0
  run:
    - python
    # https://github.com/pygraphviz/pygraphviz/blob/pygraphviz-1.14/INSTALL.txt#L8
    - graphviz

{% set ignored_tests = " not (test_drawing_png_output_with_NULL_smoketest or test_layout_prog_arg or test_repr_output or test_mimetype_select or test_drawing_makes_file)" %}  # [win]
test:
  imports:
    - pygraphviz
    - pygraphviz.tests
  source_files:
    - pygraphviz/tests
  commands:
    - pip check
    - pytest pygraphviz/tests --doctest-modules --durations=10 -k "{{ ignored_tests }}"  # [win]
    - pytest --doctest-modules --durations=10 --pyargs pygraphviz  # [not win]
  requires:
    - pip
    - pytest

about:
  home: https://pygraphviz.github.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python interface to Graphviz
  description: |
    PyGraphviz is a Python interface to the Graphviz graph layout and
    visualization package. With PyGraphviz you can create, edit, read, write,
    and draw graphs using Python to access the Graphviz graph data structure
    and layout algorithms. PyGraphviz provides a similar programming
    interface to NetworkX (https://networkx.github.io).
  doc_url: https://pygraphviz.github.io/documentation/latest/
  dev_url: https://github.com/pygraphviz/pygraphviz

extra:
  recipe-maintainers:
    - nehaljwani
